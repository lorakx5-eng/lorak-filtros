<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Câmera com Moldura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Área principal de exibição -->
    <div class="camera-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
      <img id="moldura" class="moldura-overlay" alt="Moldura" src="">
      
      <!-- Previews pós-captura -->
      <img id="preview-img" class="hidden" alt="Foto Capturada">
      <video id="preview-video" class="hidden" playsinline controls loop></video>
    </div>

    <!-- Indicador de Gravação REC -->
    <div id="recording-status" class="hidden">
      <span class="rec-dot"></span>
      <span>REC</span>
    </div>

    <!-- Botão de Inverter Câmera (Estilo Instagram Stories - Canto Superior Direito) -->
    <button id="btn-switch-camera" class="btn-icon-stories" aria-label="Trocar Câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0-4.418-3.582-8-8-8S4 5.582 4 10d0 0 0 0"></path>
        <path d="M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8"></path>
        <polyline points="1 7 4 10 7 7"></polyline>
        <polyline points="23 17 20 14 17 17"></polyline>
      </svg>
    </button>

    <!-- Controles de Câmera (Modos e Captura) -->
    <div id="controls-camera" class="controls">
      <div class="shutter-container">
        <button id="btn-capture" class="btn-shutter" aria-label="Capturar"></button>
      </div>

      <div class="mode-selector">
        <button id="btn-mode-foto" class="active">FOTO</button>
        <button id="btn-mode-video">VÍDEO</button>
      </div>
    </div>

    <!-- Controles da Prévia (Refazer / Baixar) -->
    <div id="controls-preview" class="controls hidden">
      <button id="btn-refazer" class="btn-secondary">Refazer</button>
      <button id="btn-salvar" class="btn-primary">Baixar</button>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
